# Run by hand (Actions tab -> "Cancel stuck Pages deploy" -> Run workflow) when GitHub Pages
# refuses new deploys with "due to in progress deployment. Please cancel <commit> first".
# Paste that commit ID. This clears the stuck deploy; it does not publish anything.
# Steps follow the community fix: mark the stuck deployment inactive, delete it,
# then cancel the Pages deployment for that commit.
name: Cancel stuck Pages deploy

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit ID of the stuck deploy (from the error message)"
        required: true

permissions:
  pages: write
  deployments: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COMMIT: ${{ inputs.commit }}
      API: https://api.github.com/repos/${{ github.repository }}
    steps:
      - name: Show the Pages deploy status for that commit
        run: |
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/pages/deployments/$COMMIT" || true

      - name: Mark the stuck deployment inactive and delete it
        run: |
          ids=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/deployments?sha=$COMMIT&per_page=100" | jq -r '.[].id')
          echo "Deployments for $COMMIT: ${ids:-none}"
          for id in $ids; do
            echo "Latest status of $id:"
            curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/deployments/$id/statuses?per_page=1" | jq -r '.[0].state // "none"'
            curl -sS -o /dev/null -w "Set $id inactive: %{http_code}\n" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -d '{"state":"inactive"}' "$API/deployments/$id/statuses"
            curl -sS -o /dev/null -w "Delete $id: %{http_code}\n" -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/deployments/$id"
          done

      - name: Cancel the Pages deploy
        run: |
          code=$(curl -sS -o response.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/pages/deployments/$COMMIT/cancel")
          echo "Cancel answered: $code"
          cat response.txt
