<body data-page="home">
<div class="app">
  <div class="demo pad" data-t="demo"></div>
  <header class="sign pad">
    <div class="sign-top"><div class="head-btns"><button class="theme-btn" type="button" data-theme-btn><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button class="lang-btn" type="button" data-lang data-t="langBtn"></button></div></div>
    <div class="board">
      <h1 class="brand"><img class="logo" src="assets/logo.png" alt="" width="506" height="266"><span class="brand-name" data-t="brand"></span></h1>
      <p class="tagline" data-t="tagline"></p>
    </div>
    <p class="sign-status" data-statusline><span class="dot"></span><span data-status-text></span></p>
  </header>

  <p class="offer pad" id="offer" hidden></p>

  <div class="home-actions pad">
    <a class="btn btn-primary" href="menu" data-t="seeMenu"></a>
    <a class="btn btn-outline" href="info" data-t="hoursAddress"></a>
    <a class="btn btn-cream span-2" data-hs href="#" target="_blank" rel="noopener" data-t="orderHS"></a>
    <p class="hs-note span-2" data-t="orderHSNote"></p>
  </div>

  <section class="feature pad" aria-labelledby="featTitle">
    <div class="feature-top">
      <img class="feat-img" data-feat-img alt="" width="96" height="96" hidden>
      <div class="feat-text">
        <h2 id="featTitle" data-feat-name></h2>
        <span class="price-lg" data-feat-price></span>
        <p class="feature-note" data-t="featureNote"></p>
      </div>
    </div>
    <a class="btn btn-primary feature-link" href="menu#crepes" data-t="seeOnMenu"></a>
  </section>

  <section class="sec pad">
    <h2 class="sec-h" data-t="menuTitle"></h2>
    <div id="catRows"></div>
  </section>

  <section class="sec pad">
    <h2 class="sec-h" data-t="visitTitle"></h2>
    <div id="visitRows"></div>
    <a class="btn btn-outline dir-btn" data-dir href="#" target="_blank" rel="noopener" data-t="directions"></a>
  </section>

  <p class="foot pad" data-t="footer"></p>
</div>
