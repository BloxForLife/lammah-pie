<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B3A8C">
<title>فرن الحارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Readex+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=202611011025">
</head>
<body data-page="home">
<div class="app">
  <div class="demo pad" data-t="demo"></div>
  <header class="sign pad">
    <div class="sign-top"><button class="lang-btn" type="button" data-lang data-t="langBtn"></button></div>
    <!-- LOGO: once the shop agrees, put <img src="assets/logo.png" alt="" style="height:72px;margin-bottom:6px"> inside .board, above the name -->
    <div class="board">
      <h1 class="wordmark" data-t="brand"></h1>
      <p class="tagline" data-t="tagline"></p>
    </div>
    <p class="sign-status" data-statusline><span class="dot"></span><span data-status-text></span></p>
  </header>

  <div class="home-actions pad">
    <a class="btn btn-primary" href="menu.html" data-t="seeMenu"></a>
    <a class="btn btn-outline" href="info.html" data-t="hoursAddress"></a>
    <a class="btn btn-gold span-2" data-hs href="#" target="_blank" rel="noopener" data-t="orderHS"></a>
  </div>

  <section class="feature pad" aria-labelledby="featTitle">
    <div class="feature-top"><h2 id="featTitle" data-feat-name></h2><span class="price-lg" data-feat-price></span></div>
    <p data-feat-desc></p>
    <p class="feature-note" data-t="featureNote"></p>
    <a class="btn btn-primary feature-link" href="menu.html#sweet" data-t="seeOnMenu"></a>
  </section>

  <section class="sec pad">
    <h2 class="sec-h" data-t="menuTitle"></h2>
    <div id="catRows"></div>
  </section>

  <section class="sec pad">
    <h2 class="sec-h" data-t="visitTitle"></h2>
    <div id="visitRows"></div>
  </section>

  <p class="foot pad" data-t="footer"></p>
</div>

<nav class="bnav" aria-label="Main">
  <div class="bnav-inner">
    <a href="index.html" data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg><span data-t="navHome"></span></a>
    <a href="menu.html" data-nav="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M5 10h14M5 15h14M5 20h9"/></svg><span data-t="navMenu"></span></a>
    <a href="info.html" data-nav="info"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8v.2"/></svg><span data-t="navInfo"></span></a>
  </div>
</nav>
<script src="assets/app.js?v=202611011025"></script>
</body>
</html>
