<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>السلة · فرن الحارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="cart">
<div class="app">
  <div class="demo pad" data-t="demo"></div>
  <header class="topbar"><div class="topbar-inner pad"><h1 data-t="navCart"></h1><button class="lang-sm" type="button" data-lang data-t="langBtn"></button></div></header>

  <section class="empty-state pad" id="cartEmpty" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/></svg>
    <h2 data-t="emptyCart"></h2>
    <p data-t="emptyCartSub"></p>
    <a class="btn btn-primary" href="menu.html" data-t="browseMenu"></a>
  </section>

  <div id="cartFull" hidden>
    <section class="pad"><div id="cartItems"></div></section>

    <section class="block pad">
      <span class="sub-h" data-t="orderType"></span>
      <div class="seg" role="group">
        <button type="button" data-type="pickup" data-t="pickup"></button>
        <button type="button" data-type="delivery" data-t="delivery"></button>
      </div>
    </section>

    <section class="block pad">
      <label class="sub-h" for="notes" data-t="notesL"></label>
      <textarea id="notes" data-ph="notesPh"></textarea>
    </section>

    <section class="block pad">
      <div class="sumline"><span data-t="itemsLabel"></span><span id="sumCount"></span></div>
      <div class="sumline total"><span data-t="total"></span><span id="sumTotal"></span></div>
      <button class="wa-btn" id="sendBtn" type="button" data-t="send"></button>
      <p class="toast" id="toast" hidden></p>
      <details>
        <summary data-t="preview"></summary>
        <textarea id="msg" readonly></textarea>
        <button class="link-btn" id="copyBtn" type="button" data-t="copy"></button>
      </details>
      <div class="foot-row"><button class="clear" id="clearBtn" type="button" data-t="clear"></button></div>
    </section>
  </div>

  <p class="foot pad" data-t="footer"></p>
</div>

<nav class="bnav" aria-label="Main">
  <div class="bnav-inner">
    <a href="index.html" data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg><span data-t="navHome"></span></a>
    <a href="menu.html" data-nav="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M5 10h14M5 15h14M5 20h9"/></svg><span data-t="navMenu"></span></a>
    <a href="cart.html" data-nav="cart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/></svg><span data-t="navCart"></span><i class="nbadge" id="navBadge" hidden></i></a>
    <a href="info.html" data-nav="info"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8v.2"/></svg><span data-t="navInfo"></span></a>
  </div>
</nav>
<script src="assets/app.js"></script>
</body>
</html>
